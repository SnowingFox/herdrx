[package]
name = "herdr-desktop"
version = "0.1.9"
edition = "2024"
license = "Apache-2.0"
publish = false

# Its own workspace: the GPUI app's Cargo.lock and notices stay as they ship.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
herdr-shared = { path = "../../../crates/herdr-shared" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-channel = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
