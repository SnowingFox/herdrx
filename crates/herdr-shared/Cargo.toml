[package]
name = "herdr-shared"
version = "0.1.9"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fancy-regex = "0.19"
notify = "7"
tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media_Multimedia"] }
